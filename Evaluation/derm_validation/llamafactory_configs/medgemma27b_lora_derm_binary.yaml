### model
model_name_or_path: google/medgemma-27b-it
image_min_pixels: 1024
image_max_pixels: 589824
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: derm_binary_train
dataset_dir: @BENCHMARK_ROOT@/llamafactory_data
media_dir: @IMAGE_ROOT@
template: gemma3
cutoff_len: 2048
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: @LLAMAFACTORY_SAVES@/derm_clinical_medgemma27b_binary/lora/sft
logging_steps: 10
save_strategy: "no"
plot_loss: true
overwrite_output_dir: true
report_to: none

### optimization
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
weight_decay: 0.0
optim: adamw_torch
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
seed: 42
max_grad_norm: 1.0
ddp_timeout: 180000000

### evaluation
eval_strategy: "no"
